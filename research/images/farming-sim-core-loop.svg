<svg xmlns="http://www.w3.org/2000/svg" width="680" height="250" viewBox="0 0 680 250" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Farming / crafting sim core loop</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="250" rx="12" fill="#FFFFFF"/>

  <g>
    <rect x="30" y="40" width="130" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
    <text x="95" y="66" text-anchor="middle" font-size="15" font-weight="600" fill="#085041">Collect</text>
    <text x="95" y="85" text-anchor="middle" font-size="12" fill="#0F6E56">Trees, rocks, crops</text>
  </g>
  <g>
    <rect x="190" y="40" width="130" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
    <text x="255" y="66" text-anchor="middle" font-size="15" font-weight="600" fill="#085041">Craft</text>
    <text x="255" y="85" text-anchor="middle" font-size="12" fill="#0F6E56">Tools, items</text>
  </g>
  <g>
    <rect x="350" y="40" width="130" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
    <text x="415" y="66" text-anchor="middle" font-size="15" font-weight="600" fill="#085041">Build</text>
    <text x="415" y="85" text-anchor="middle" font-size="12" fill="#0F6E56">Farms, machines</text>
  </g>
  <g>
    <rect x="510" y="40" width="140" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
    <text x="580" y="66" text-anchor="middle" font-size="15" font-weight="600" fill="#085041">Unlock land</text>
    <text x="580" y="85" text-anchor="middle" font-size="12" fill="#0F6E56">New area, new stuff</text>
  </g>

  <line x1="162" y1="70" x2="186" y2="70" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="322" y1="70" x2="346" y2="70" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="482" y1="70" x2="506" y2="70" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <path d="M580 102 L580 135 L95 135 L95 104" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="337" y="128" text-anchor="middle" font-size="12" fill="#5F5E5A">Repeat, bigger each time</text>

  <g>
    <rect x="490" y="170" width="180" height="60" rx="8" fill="#FAECE7" stroke="#993C1D"/>
    <text x="580" y="196" text-anchor="middle" font-size="15" font-weight="600" fill="#712B13">Light combat</text>
    <text x="580" y="215" text-anchor="middle" font-size="12" fill="#993C1D">Guards new land</text>
  </g>
  <line x1="580" y1="168" x2="580" y2="142" stroke="#993C1D" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
