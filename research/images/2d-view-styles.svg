<svg xmlns="http://www.w3.org/2000/svg" width="680" height="510" viewBox="0 0 680 510" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>The 4 main 2D views</title>
  <rect x="0" y="0" width="680" height="510" rx="12" fill="#FFFFFF"/>

  <!-- Side view -->
  <rect x="40" y="20" width="290" height="170" rx="8" fill="#F7F6F2" stroke="#B4B2A9"/>
  <rect x="41" y="160" width="288" height="29" fill="#C0DD97" stroke="#3B6D11" stroke-width="0.5"/>
  <rect x="150" y="110" width="90" height="10" rx="2" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
  <rect x="250" y="75" width="60" height="10" rx="2" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
  <rect x="80" y="130" width="16" height="30" rx="3" fill="#9FE1CB" stroke="#0F6E56"/>
  <circle cx="88" cy="122" r="7" fill="#9FE1CB" stroke="#0F6E56"/>
  <circle cx="270" cy="150" r="10" fill="#F5C4B3" stroke="#993C1D"/>
  <path d="M100 120 Q125 80 150 104" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="185" y="210" text-anchor="middle" font-size="15" font-weight="600" fill="#2C2C2A">Side view (platformer)</text>
  <text x="185" y="228" text-anchor="middle" font-size="12" fill="#5F5E5A">Camera from the side, gravity, jumping</text>

  <!-- Top-down -->
  <rect x="350" y="20" width="290" height="170" rx="8" fill="#F7F6F2" stroke="#B4B2A9"/>
  <rect x="450" y="60" width="120" height="8" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
  <rect x="450" y="60" width="8" height="70" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
  <rect x="562" y="60" width="8" height="70" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
  <circle cx="390" cy="60" r="16" fill="#C0DD97" stroke="#3B6D11"/>
  <circle cx="610" cy="160" r="14" fill="#C0DD97" stroke="#3B6D11"/>
  <circle cx="380" cy="150" r="12" fill="#C0DD97" stroke="#3B6D11"/>
  <circle cx="510" cy="100" r="10" fill="#9FE1CB" stroke="#0F6E56"/>
  <line x1="510" y1="100" x2="524" y2="100" stroke="#085041" stroke-width="2"/>
  <circle cx="470" cy="165" r="9" fill="#F5C4B3" stroke="#993C1D"/>
  <text x="495" y="210" text-anchor="middle" font-size="15" font-weight="600" fill="#2C2C2A">Top-down</text>
  <text x="495" y="228" text-anchor="middle" font-size="12" fill="#5F5E5A">Camera above, move in 8 directions</text>

  <!-- Isometric -->
  <rect x="40" y="250" width="290" height="170" rx="8" fill="#F7F6F2" stroke="#B4B2A9"/>
  <polygon points="185,275 305,335 185,395 65,335" fill="#C0DD97" stroke="#3B6D11" stroke-width="0.5"/>
  <line x1="125" y1="305" x2="245" y2="365" stroke="#3B6D11" stroke-width="0.5"/>
  <line x1="245" y1="305" x2="125" y2="365" stroke="#3B6D11" stroke-width="0.5"/>
  <polygon points="185,300 215,315 185,330 155,315" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/>
  <polygon points="155,315 185,330 185,360 155,345" fill="#EF9F27" stroke="#854F0B" stroke-width="0.5"/>
  <polygon points="185,330 215,315 215,345 185,360" fill="#BA7517" stroke="#854F0B" stroke-width="0.5"/>
  <circle cx="250" cy="345" r="7" fill="#9FE1CB" stroke="#0F6E56"/>
  <text x="185" y="440" text-anchor="middle" font-size="15" font-weight="600" fill="#2C2C2A">Isometric</text>
  <text x="185" y="458" text-anchor="middle" font-size="12" fill="#5F5E5A">Diagonal angle, looks like 3D</text>

  <!-- Single screen -->
  <rect x="350" y="250" width="290" height="170" rx="8" fill="#F7F6F2" stroke="#B4B2A9"/>
  <g stroke-width="0.5">
    <rect x="373" y="272" width="34" height="34" rx="4" fill="#9FE1CB" stroke="#0F6E56"/>
    <rect x="415" y="272" width="34" height="34" rx="4" fill="#F5C4B3" stroke="#993C1D"/>
    <rect x="457" y="272" width="34" height="34" rx="4" fill="#9FE1CB" stroke="#0F6E56"/>
    <rect x="499" y="272" width="34" height="34" rx="4" fill="#FAC775" stroke="#854F0B"/>
    <rect x="541" y="272" width="34" height="34" rx="4" fill="#CECBF6" stroke="#534AB7"/>
    <rect x="583" y="272" width="34" height="34" rx="4" fill="#F5C4B3" stroke="#993C1D"/>
    <rect x="373" y="314" width="34" height="34" rx="4" fill="#FAC775" stroke="#854F0B"/>
    <rect x="415" y="314" width="34" height="34" rx="4" fill="#FAC775" stroke="#854F0B"/>
    <rect x="457" y="314" width="34" height="34" rx="4" fill="#FAC775" stroke="#854F0B" stroke-width="2"/>
    <rect x="499" y="314" width="34" height="34" rx="4" fill="#9FE1CB" stroke="#0F6E56"/>
    <rect x="541" y="314" width="34" height="34" rx="4" fill="#F5C4B3" stroke="#993C1D"/>
    <rect x="583" y="314" width="34" height="34" rx="4" fill="#CECBF6" stroke="#534AB7"/>
    <rect x="373" y="356" width="34" height="34" rx="4" fill="#CECBF6" stroke="#534AB7"/>
    <rect x="415" y="356" width="34" height="34" rx="4" fill="#9FE1CB" stroke="#0F6E56"/>
    <rect x="457" y="356" width="34" height="34" rx="4" fill="#F5C4B3" stroke="#993C1D"/>
    <rect x="499" y="356" width="34" height="34" rx="4" fill="#CECBF6" stroke="#534AB7"/>
    <rect x="541" y="356" width="34" height="34" rx="4" fill="#FAC775" stroke="#854F0B"/>
    <rect x="583" y="356" width="34" height="34" rx="4" fill="#9FE1CB" stroke="#0F6E56"/>
  </g>
  <text x="495" y="440" text-anchor="middle" font-size="15" font-weight="600" fill="#2C2C2A">Single screen (board / UI)</text>
  <text x="495" y="458" text-anchor="middle" font-size="12" fill="#5F5E5A">No moving camera, grid or cards</text>

  <!-- Legend -->
  <circle cx="150" cy="487" r="6" fill="#9FE1CB" stroke="#0F6E56"/>
  <text x="161" y="491" font-size="12" fill="#5F5E5A">Player</text>
  <circle cx="230" cy="487" r="6" fill="#F5C4B3" stroke="#993C1D"/>
  <text x="241" y="491" font-size="12" fill="#5F5E5A">Enemy</text>
  <circle cx="310" cy="487" r="6" fill="#C0DD97" stroke="#3B6D11"/>
  <text x="321" y="491" font-size="12" fill="#5F5E5A">Tree / ground</text>
  <rect x="420" y="482" width="20" height="10" rx="2" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="447" y="491" font-size="12" fill="#5F5E5A">Platform / wall</text>
</svg>
